<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Controle do Sinal</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        button { padding: 20px; font-size: 24px; margin: 10px; }
        .panic { background-color: red; color: white; border: none; border-radius: 10px; }
        .normal { background-color: green; color: white; border: none; border-radius: 10px; }
        #status { font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🔔 Controle do Sinal</h1>
    <p>IP do ESP32: <span id="ipDisplay">Carregando...</span></p>
    <button id="btnPanic" class="panic">🚨 Ativar Pânico</button>
    <div id="status">Status: Normal</div>

    <script>
        // === CONFIGURAÇÃO ===
        // Substitua pelo IP do seu ESP32 (obtido no serial)
        const ESP_IP = '192.168.50.148';   // ALTERE AQUI!

        const btn = document.getElementById('btnPanic');
        const statusDiv = document.getElementById('status');
        const ipDisplay = document.getElementById('ipDisplay');

        ipDisplay.textContent = ESP_IP;

        let panicActive = false;

        btn.addEventListener('click', function() {
            panicActive = !panicActive;
            const state = panicActive ? 1 : 0;
            const url = `http://${ESP_IP}/panic?state=${state}`;
            fetch(url)
                .then(response => response.text())
                .then(data => {
                    if (panicActive) {
                        btn.textContent = '🛑 Desativar Pânico';
                        btn.className = 'normal';
                        statusDiv.textContent = 'Status: PÂNICO ATIVO!';
                        statusDiv.style.color = 'red';
                    } else {
                        btn.textContent = '🚨 Ativar Pânico';
                        btn.className = 'panic';
                        statusDiv.textContent = 'Status: Normal';
                        statusDiv.style.color = 'green';
                    }
                })
                .catch(err => {
                    alert('Erro ao comunicar com o ESP32. Verifique o IP e a conexão.');
                    console.error(err);
                    // Reverte estado
                    panicActive = !panicActive;
                });
        });
    </script>
</body>
</html>
